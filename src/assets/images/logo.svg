<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Organic outer silhouette of the orb -->
    <clipPath id="blob">
      <path d="M62 30C80 14 118 22 142 36C166 50 182 78 178 112C174 144 154 172 124 180C98 187 70 178 52 162C38 150 40 136 30 124C18 108 26 90 36 80C42 66 48 42 62 30Z"/>
    </clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="glyph-floor"><rect x="0" y="0" width="200" height="128"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#blob)">
    <!-- deep base -->
    <rect width="200" height="200" fill="#0a0620"/>
    <!-- colour glows, blurred so they melt into each other -->
    <ellipse cx="62" cy="52" rx="42" ry="30" fill="#2fe6e0" filter="url(#soft)" opacity="0.95"/>
    <ellipse cx="44" cy="112" rx="34" ry="44" fill="#9b4dff" filter="url(#soft)"/>
    <ellipse cx="90" cy="70" rx="40" ry="26" fill="#3b6dff" filter="url(#soft)" opacity="0.85"/>
    <ellipse cx="146" cy="62" rx="34" ry="26" fill="#1fe3ee" filter="url(#soft)" opacity="0.9"/>
    <ellipse cx="170" cy="104" rx="26" ry="38" fill="#7a3cff" filter="url(#soft)"/>
    <ellipse cx="96" cy="164" rx="48" ry="24" fill="#ff5fd2" filter="url(#soft)" opacity="0.9"/>
    <ellipse cx="146" cy="150" rx="28" ry="22" fill="#9fd6ff" filter="url(#soft)" opacity="0.8"/>
    <!-- dark core so the glyph reads -->
    <ellipse cx="102" cy="108" rx="44" ry="42" fill="#04030f" filter="url(#softer)" opacity="0.95"/>
  </g>

  <!-- thin luminous ring -->
  <circle cx="100" cy="100" r="62" stroke="#ffffff" stroke-width="1.6" opacity="0.95" filter="url(#glow)"/>

  <!-- "AI" glyph: open-top lambda A + bar I -->
  <g clip-path="url(#glyph-floor)" stroke="#ffffff" stroke-width="8" stroke-linecap="butt" stroke-linejoin="round" fill="none">
    <path d="M68 134 L87 86 Q91 77 98 86 L112 134" stroke-linecap="butt"/>
    <path d="M126 80 V128"/>
  </g>
</svg>
